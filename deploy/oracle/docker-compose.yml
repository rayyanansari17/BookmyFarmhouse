# Run from the repo root:
#   docker compose -f deploy/oracle/docker-compose.yml --env-file deploy/oracle/.env up -d --build
name: bmf

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    # no published ports: only reachable from other containers

  scraper:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.scraper
    restart: unless-stopped
    depends_on: [redis]
    environment:
      PORT: "3001"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SCRAPER_SECRET: ${SCRAPER_SECRET:?SCRAPER_SECRET must be set}
    shm_size: "1gb" # Chromium needs a larger /dev/shm
    init: true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [scraper]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SCRAPER_HOST: ${SCRAPER_HOST:?SCRAPER_HOST must be set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  caddy-data:
  caddy-config:
